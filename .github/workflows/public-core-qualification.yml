name: Public Calendar Core — zero-cost standalone qualification

on:
  push:
    paths:
      - ".github/workflows/public-core-qualification.yml"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/**"
      - "stillpoint/cli.py"
      - "tests/public_core/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/public-core-qualification.yml"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/**"
      - "stillpoint/cli.py"
      - "tests/public_core/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  standalone-public-calendar:
    name: Public Core / Python \${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out public Core only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install only the public source package
        run: python -m pip install .
      - name: Verify public calendar contract and finite publication
        run: python -m unittest discover -s tests/public_core -p 'test_*.py' -v
