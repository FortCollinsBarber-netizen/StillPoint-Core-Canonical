name: CivicClock
options:
  bundleIdPrefix: com.stillpoint
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  CivicClockWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: WatchApp
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpoint.civicclock.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Civic Clock
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Civic Clock uses your location only to calculate the local sunset boundary.
        CODE_SIGN_ENTITLEMENTS: WatchApp/CivicClockWatch.entitlements
    dependencies:
      - target: CivicClockWidgets

  CivicClockWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: Widgets
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpoint.civicclock.watch.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Civic Clock
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Widgets/CivicClockWidgets.entitlements

  CivicClockTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: Tests
    dependencies:
      - target: CivicClockWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stillpoint.civicclock.tests
