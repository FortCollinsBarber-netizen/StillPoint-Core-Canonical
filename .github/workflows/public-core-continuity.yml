name: Public Core continuity (no private repositories)

on:
  push:
    paths:
      - ".github/workflows/public-core-continuity.yml"
      - "docs/PUBLIC_CORE_CONTINUITY_2026-11-17.md"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/calendar_*.json"
      - "tests/calendar_core/**"
      - "tests/test_common_calendar_v2.py"
  pull_request:
    paths:
      - ".github/workflows/public-core-continuity.yml"
      - "docs/PUBLIC_CORE_CONTINUITY_2026-11-17.md"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/calendar_*.json"
      - "tests/calendar_core/**"
      - "tests/test_common_calendar_v2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-core-continuity:
    name: Public-only Calendar Core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout public Core only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public repository context
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "FortCollinsBarber-netizen/StillPoint-Core-Canonical"
          test -f stillpoint/contracts/calendar_core_spec.json
          test -f stillpoint/contracts/calendar_publication_2026_2075.json
      - name: Install only public Core package
        run: python -m pip install .
      - name: Execute public Calendar Core suite
        run: python -m unittest discover -s tests/calendar_core -p 'test_*.py' -q
      - name: Execute finite-publication regression suite
        run: python -m unittest discover -s tests -p 'test_common_calendar_v2.py' -q
      - name: Assert 364/52 geometry and public 2026-2075 boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from stillpoint.calendar_core import build_calendar_core_spec

          spec = build_calendar_core_spec()
          calendar = spec["ordinaryCalendar"]
          assert calendar["baseYearDays"] == 364
          assert calendar["weeksPerYear"] == 52
          assert calendar["yearClosing"] == {"month": 12, "day": 30}

          document = json.loads(
              Path("stillpoint/contracts/calendar_publication_2026_2075.json").read_text(encoding="utf-8")
          )
          published = [entry["year"] for entry in document["years"]]
          assert published == list(range(2026, 2076)), published
          assert 2076 not in published, "2076 is mathematical, not published"
          print("PUBLIC_CORE_CONTINUITY_PASS: executed public Core only; 364 days, 52 weeks, finite 2026-2075 publication")
          PY
