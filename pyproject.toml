[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stillpoint-core"
version = "0.2.0rc2"
description = "Provider-independent company operating system runtime for StillPoint"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Robert Emmanuel LaDay"}]
dependencies = []

[project.scripts]
stillpoint = "stillpoint.cli:main"
stillpoint-signal-mail = "stillpoint.signal_mail_service:main"

[tool.setuptools.packages.find]
include = ["stillpoint*"]

[tool.setuptools.package-data]
stillpoint = ["contracts/*.json", "migrations/*.sql", "defaults/*.json"]
