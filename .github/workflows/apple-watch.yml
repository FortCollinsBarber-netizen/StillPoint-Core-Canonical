name: Apple Watch Common Calendar CI

on:
  push:
    paths:
      - "clients/apple-watch/**"
      - "stillpoint/calendar_core/**"
      - "tools/export_calendar_core_contract.py"
      - ".github/workflows/apple-watch.yml"
  pull_request:
    paths:
      - "clients/apple-watch/**"
      - "stillpoint/calendar_core/**"
      - "tools/export_calendar_core_contract.py"
      - ".github/workflows/apple-watch.yml"

permissions:
  contents: read

jobs:
  calendar-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Watch contract was generated by Calendar Core
        run: |
          PYTHONPATH=. python3 tools/export_calendar_core_contract.py --output /tmp/calendar_core_contract.json
          diff -u /tmp/calendar_core_contract.json clients/apple-watch/CivicClock/Resources/calendar_core_contract.json

      - name: Test native Watch projection against Calendar Core contract
        working-directory: clients/apple-watch/CivicClock
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate watchOS project
        working-directory: clients/apple-watch/CivicClock
        run: xcodegen generate

      - name: Build watchOS app and WidgetKit complications
        working-directory: clients/apple-watch/CivicClock
        run: |
          xcodebuild \
            -project CivicClock.xcodeproj \
            -scheme CivicClockWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
