name: Apple Watch Common Calendar CI

on:
  push:
    paths:
      - "clients/apple-watch/**"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/calendar_core_*.json"\n      - "stillpoint/contracts/calendar_sacred_civic_map.json"
      - "specs/temporal_calendar/**"
      - "temporal/v3.3/**"
      - "temporal/jubilee-v1/**"
      - "tools/export_calendar_core_artifacts.py"
      - "tools/generate_common_calendar_v33.py"
      - ".github/workflows/apple-watch.yml"
  pull_request:
    paths:
      - "clients/apple-watch/**"
      - "stillpoint/calendar_core/**"
      - "stillpoint/contracts/calendar_core_*.json"
      - "specs/temporal_calendar/**"
      - "temporal/v3.3/**"
      - "temporal/jubilee-v1/**"
      - "tools/export_calendar_core_artifacts.py"
      - "tools/generate_common_calendar_v33.py"
      - ".github/workflows/apple-watch.yml"

permissions:
  contents: read

jobs:
  calendar-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install proven Calendar Core package
        run: python -m pip install .

      - name: Regenerate shared law and projection proof
        run: |
          python tools/export_calendar_core_artifacts.py \
            --spec-output /tmp/calendar_core_spec.json \
            --vectors-output /tmp/calendar_projection_vectors.json \
            --map-output /tmp/calendar_sacred_civic_map.json \
            --manifest-output /tmp/calendar_core_artifact_manifest.json
          diff -u /tmp/calendar_core_spec.json stillpoint/contracts/calendar_core_spec.json
          diff -u /tmp/calendar_projection_vectors.json stillpoint/contracts/calendar_projection_vectors.json
          diff -u /tmp/calendar_sacred_civic_map.json stillpoint/contracts/calendar_sacred_civic_map.json
          diff -u /tmp/calendar_core_artifact_manifest.json stillpoint/contracts/calendar_core_artifact_manifest.json
          diff -u /tmp/calendar_core_spec.json clients/apple-watch/CivicClock/Resources/calendar_core_spec.json
          diff -u /tmp/calendar_projection_vectors.json clients/apple-watch/CivicClock/Resources/calendar_projection_vectors.json

      - name: Prove no unratified operative calendar publication is bundled
        run: |
          test ! -e clients/apple-watch/CivicClock/Resources/published_calendar.json

      - name: Test native Watch projection against shared artifacts
        working-directory: clients/apple-watch/CivicClock
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate watchOS project
        working-directory: clients/apple-watch/CivicClock
        run: xcodegen generate

      - name: Build watchOS app and WidgetKit complications
        working-directory: clients/apple-watch/CivicClock
        run: |
          xcodebuild \
            -project CivicClock.xcodeproj \
            -scheme CivicClockWatch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
