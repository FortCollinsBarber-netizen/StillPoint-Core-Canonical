name: Public Calendar browser build (public Core only)

on:
  push:
    paths:
      - "site/stillpoint-calendar/**"
      - "tools/export_public_calendar_site.py"
      - "tests/calendar_core/test_public_calendar_site_export.py"
      - ".github/workflows/public-calendar-browser.yml"
  pull_request:
    paths:
      - "site/stillpoint-calendar/**"
      - "tools/export_public_calendar_site.py"
      - "tests/calendar_core/test_public_calendar_site_export.py"
      - ".github/workflows/public-calendar-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    name: Generate complete 50-year public browser dataset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out public Canonical Core only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install public Core source
        run: python -m pip install .
      - name: Test static exporter against actual public Core
        run: python -m unittest discover -s tests/calendar_core -p 'test_public_calendar_site_export.py' -v
      - name: Build complete browser site from public Core only
        run: |
          python tools/export_public_calendar_site.py --output /tmp/stillpoint-public-browser
      - name: Verify full 50-year static output and finite boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/stillpoint-public-browser")
          manifest = json.loads((root/"data/index.json").read_text())
          assert manifest["complete_publication"] is True
          assert len(manifest["years"]) == 50
          assert manifest["first_common_year"] == 2026
          assert manifest["last_common_year"] == 2075
          assert sum(entry["count"] for entry in manifest["years"]) == 18200
          assert {entry["year"] for entry in manifest["years"]} == set(range(2026, 2076))
          assert not (root/"data/Y_2076.json").exists()
          assert manifest["assistant_schema"] == "stillpoint.public-assistant-static-weeks.v1"
          assert sum(entry["assistant_week_count"] for entry in manifest["years"]) == 2600
          for entry in manifest["years"]:
              assert (root/entry["assistant_path"]).is_file()
          assert not (root/"data/assistant/Y_2076.json").exists()
          assert all((root/entry["path"]).is_file() for entry in manifest["years"])
          assert (root/"index.html").is_file()
          print("PUBLIC_BROWSER_50_YEAR_EXPORT_PASS")
          PY

# Site publication is a separate explicit step: this workflow proves and builds
# the local static deliverable. It does not deploy, publish private code, create
# another repository, use paid providers, or modify GitHub Pages settings.
